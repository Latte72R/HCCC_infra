apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hccc
  labels:
    app.kubernetes.io/name: hccc-frontend
spec:
  selector:
    app.kubernetes.io/name: hccc-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hccc
  labels:
    app.kubernetes.io/name: hccc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hccc-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hccc-frontend
    spec:
      containers:
        - name: frontend
          # standalone Next.js image built from HCCC_frontend/Dockerfile.
          image: ghcr.io/latte72r/hccc-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: HCCC_API_INTERNAL_URL
              value: http://web-server:55301
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
