apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hccc

resources:
  - namespace.yaml
  - postgres.yaml
  - web.yaml
  - judge.yaml
  - frontend.yaml
  - ingress.yaml
  - networkpolicy.yaml

# Seeds a fresh database from scripts/init.sql on first boot.
# (Existing volumes keep their data; run scripts/migrations instead.)
configMapGenerator:
  - name: hccc-db-init
    files:
      - init.sql=../scripts/init.sql
      - 002_judge_claim.sql=../scripts/migrations/002_judge_claim.sql

# Created with `kubectl -n hccc create secret ...` / ConfigMap values;
# see k8s/README.md. Placeholders below are replaced at deploy time.
