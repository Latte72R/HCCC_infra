services:
  frontend:
    build: ../HCCC_frontend
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    environment:
      HCCC_API_INTERNAL_URL: http://web_server:55301
    depends_on:
      web_server:
        condition: service_healthy
    restart: always

  web_server:
    build: web_server
    container_name: web_server
    ports:
      - ${BACKEND_PORT:-55301}:55301
    environment:
      RUST_LOG: ${RUST_LOG:-web_server=info}
      DATABASE_URL: postgres://${POSTGRES_USER:-kcs1959}:${POSTGRES_PASSWORD:-WeL0veKCS}@db:5432/${POSTGRES_DB:-hccc_judge}
      CONTEST_BEGIN: ${CONTEST_BEGIN:-2025-09-01T00:00:00+09:00}
      CONTEST_END: ${CONTEST_END:-2025-09-20T00:00:00+09:00}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:55301/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    
  judge_server:
    build: judge_server
    container_name: judge_server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kcs1959}:${POSTGRES_PASSWORD:-WeL0veKCS}@db:5432/${POSTGRES_DB:-hccc_judge}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kcs1959}
      POSTGRES_DB: ${POSTGRES_DB:-hccc_judge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-WeL0veKCS}
    volumes:
      - db_store:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: psql -U ${POSTGRES_USER:-kcs1959} -d ${POSTGRES_DB:-hccc_judge} -c 'SELECT 1' || exit 1
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s

  test_runner_x8664:
    image: ghcr.io/humanccompilercontest/hccc_infra:test_runner_x8664-develop
    container_name: test_runner_x8664
    tty: true
    stdin_open: true
    profiles:
      - test_runner

  test_runner_riscv:
    image: ghcr.io/humanccompilercontest/hccc_infra:test_runner_riscv-develop
    container_name: test_runner_riscv
    tty: true
    stdin_open: true
    profiles:
      - test_runner

volumes:
  db_store:
